<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets | Mesa de ayuda Nova</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">NOVA SERVICES</span>
      <strong>Mesa de ayuda</strong>
    </div>
    <div class="session-summary">
      <span id="session-name"></span>
      <span id="session-role" class="role-badge" data-testid="session-role"></span>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </div>
  </header>

  <main class="workspace">
    <section class="hero">
      <div>
        <span class="step">GESTIÓN DE INCIDENCIAS</span>
        <h1 id="dashboard-title">Panel de tickets</h1>
        <p id="dashboard-description"></p>
      </div>
      <div class="metric">
        <span id="ticket-count">0</span>
        <small>tickets visibles</small>
      </div>
    </section>

    <section class="ticket-layout">
      <div class="ticket-list-card">
        <div class="section-heading">
          <h2>Tickets</h2>
          <label>Filtrar
            <select id="status-filter">
              <option value="TODOS">Todos</option>
              <option value="ABIERTO">Abiertos</option>
              <option value="EN_PROCESO">En proceso</option>
              <option value="RESUELTO">Resueltos</option>
            </select>
          </label>
        </div>
        <div id="ticket-list" class="ticket-list" data-testid="ticket-list"></div>
      </div>

      <section id="ticket-detail" class="detail-card hidden" aria-live="polite" data-testid="ticket-detail">
        <div class="detail-header">
          <div>
            <span id="detail-id" class="ticket-id"></span>
            <h2 id="detail-title"></h2>
          </div>
          <span id="detail-status" class="status"></span>
        </div>
        <dl class="ticket-data">
          <div><dt>Solicitante</dt><dd id="detail-requester"></dd></div>
          <div><dt>Prioridad</dt><dd id="detail-priority"></dd></div>
          <div><dt>Grupo asignado</dt><dd id="detail-group"></dd></div>
          <div><dt>Descripción</dt><dd id="detail-description"></dd></div>
        </dl>

        <form id="agent-form" class="agent-tools hidden" aria-labelledby="agent-tools-title">
          <h3 id="agent-tools-title">Herramientas del agente</h3>
          <label for="priority">Prioridad</label>
          <select id="priority" name="priority">
            <option>Baja</option><option>Media</option><option>Alta</option><option>Crítica</option>
          </select>
          <label for="group">Grupo asignado</label>
          <select id="group" name="group">
            <option>Mesa de ayuda</option><option>Infraestructura</option><option>Aplicaciones</option><option>Seguridad</option>
          </select>
          <label for="status">Estado</label>
          <select id="status" name="status">
            <option value="ABIERTO">Abierto</option>
            <option value="EN_PROCESO">En proceso</option>
            <option value="RESUELTO">Resuelto</option>
          </select>
          <button type="submit" class="primary">Guardar cambios</button>
        </form>

        <p id="update-message" class="success hidden" role="status"></p>
      </section>
    </section>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
